services:
  backend:
    build:
      context: ./yoka-api
      dockerfile: Dockerfile.local
    init: true
    env_file: ./yoka-api/.env
    environment:
      NODE_ENV: development
      PORT: "3101"
      DATABASE_URL: postgresql://yoka:yoka_local@db:5432/yoka_local?schema=public
      JWT_SECRET: yoka-local-development-only
      HOST_URL: http://localhost:3200
      REDIRECT_URL: http://localhost:3200
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    ports:
      - "127.0.0.1:3201:3101"
    volumes:
      - local-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --skip-generate && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./yoka-web
      dockerfile: Dockerfile.local
    init: true
    env_file: ./yoka-web/.env
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://backend:3101/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3201/api/v1
      NEXT_PUBLIC_HOST_IMAGE: http://localhost:3201/
    ports:
      - "127.0.0.1:3200:3100"
    command: npm run dev -- --hostname 0.0.0.0 --port 3100
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./yoga-admin
      dockerfile: Dockerfile.local
    init: true
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3201/api/v1
      VITE_HOST_IMAGE: http://localhost:3201/
    ports:
      - "127.0.0.1:3202:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yoka
      POSTGRES_PASSWORD: yoka_local
      POSTGRES_DB: yoka_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoka -d yoka_local"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  local-db:
  local-uploads:
