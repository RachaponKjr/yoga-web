version: "3.8"

services:
  frontend:
    container_name: yoga-frontend
    build:
      context: ./yoka-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yogabyniti.com/api/v1}
        NEXT_PUBLIC_HOST_IMAGE: ${NEXT_PUBLIC_HOST_IMAGE:-https://api.yogabyniti.com/}
    restart: always
    ports:
      - "3004:3001"
    env_file: .env
    networks:
      - yoga-network
    depends_on:
      - backend

  admin:
    container_name: yoga-admin
    build:
      context: ./yoga-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.yogabyniti.com/api/v1}
        VITE_HOST_IMAGE: ${VITE_HOST_IMAGE:-https://api.yogabyniti.com/}
    restart: always
    ports:
      - "3003:3002"
    env_file: .env
    networks:
      - yoga-network
    depends_on:
      - backend

  backend:
    container_name: yoga-backend
    build:
      context: ./yoka-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4001:3001"
    env_file:
      - .env
    networks:
      - yoga-network
    depends_on:
      - db
    volumes:
      - backend-uploads:/app/uploads

  db:
    container_name: yoga-db
    image: postgres:15-alpine
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - yoga-network

networks:
  yoga-network:
    driver: bridge

volumes:
  db-data:
  backend-uploads:
