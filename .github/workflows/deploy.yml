name: Deploy to VPS

on:
  push:
    branches:
      - main # ทำงานเมื่อ push เข้า main (เปลี่ยนชื่อ branch ได้)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์ (แก้ path ให้ตรงกับเครื่องจริง)
            cd ~/yoga-web

            # 2. ดึง Code ล่าสุด
            git pull origin main

            # 3. Build และ Run ใหม่ (เฉพาะตัวที่มีการเปลี่ยนแปลง)
            # -d = run background
            # --build = บังคับ build image ใหม่ถ้ามีการแก้ code
            docker compose up -d --build --no-cache

            # 4. ลบ Image เก่าที่ไม่ได้ใช้ทิ้ง (เพื่อไม่ให้รก Server)
            docker image prune -f
