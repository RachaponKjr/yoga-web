name: Deploy to VPS

on:
  push:
    branches:
      - main # ทำงานเมื่อ push เข้า main (เปลี่ยนชื่อ branch ได้)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: DOT_ENV_FILE
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์ (แก้ path ให้ตรงกับเครื่องจริง)
            cd ~/yoga-web

            echo "$DOT_ENV_FILE" > .env

            # 2. ดึง Code ล่าสุด
            git fetch origin main
            git reset --hard origin/main

            docker compose down --remove-orphans

            # 3. Build ใหม่ (ใส่ --no-cache ตรงนี้ได้!)
            docker compose build --no-cache

            # 4. รันขึ้นมาใหม่
            docker compose up -d --force-recreate

            # 5. ลบขยะ
            docker image prune -f

          env:
            DOT_ENV_FILE: ${{ secrets.DOT_ENV_FILE }}
