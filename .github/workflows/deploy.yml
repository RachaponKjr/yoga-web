name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          command_timeout: 30m
          # แก้ตรงนี้: ต้องชื่อเดียวกับที่ส่งมาจากด้านล่าง (บรรทัดที่ 46)
          envs: DOT_ENV_FILE
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์
            cd ~/yoga-web

            # 2. ดึง Code ล่าสุด
            git fetch origin main
            git reset --hard origin/main

            # 3. สร้างไฟล์ .env (ใช้เครื่องหมาย ' เพื่อป้องกันการตีความตัวอักษรพิเศษ)
            cat <<EOF > .env
            $DOT_ENV_FILE
            EOF

            # ตรวจสอบทันทีในหน้า GitHub Action Log
            echo "--- Debug: .env file created ---"
            ls -la .env
            grep -q "DATABASE_URL" .env && echo "DATABASE_URL is present" || echo "DATABASE_URL MISSING!"

            # 4. จัดการ Docker
            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d --force-recreate

            # 5. ลบขยะ
            docker image prune -f

        # ส่งค่าจาก GitHub Secret ไปยัง SSH session
        env:
          DOT_ENV_FILE: ${{ secrets.DOT_ENV }}
